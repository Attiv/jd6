# Rime schema settings
# encoding: utf-8

schema:
  schema_id: xmjd6.stroke
  name: 星猫键道6五笔画扩展辅助方案·勿选
  version: "1.0"
  author:
    - ProudCat
  description: |
    O 模式的五笔画全字集扩展依赖。v/i/u/o/a 代表横、竖、撇、捺、折。

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator

speller:
  alphabet: "viuoa"

translator:
  dictionary: xmjd6.stroke
  enable_sentence: false
  enable_completion: true
  enable_user_dict: false

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
