# Rime schema settings
# encoding: utf-8

schema:
  schema_id: xmjd6.gbk
  name: 星猫键道6五笔画辅助方案·勿选
  version: "0.1"
  author:
    - ProudCat
  description: |
    五笔画辅助方案。v/i/u/o/a 代表横、竖、撇、捺、折，并保留原 ow 表情码。
  dependencies:
    - xmjd6.stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - table_translator@stroke_ext
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz0123456789"
  delimiter: " ;'"

translator:
  dictionary: xmjd6.o
  enable_sentence: false
  enable_completion: true
  enable_user_dict: false

stroke_ext:
  dictionary: xmjd6.stroke
  enable_sentence: false
  enable_completion: true
  enable_user_dict: false
  initial_quality: -1


punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
